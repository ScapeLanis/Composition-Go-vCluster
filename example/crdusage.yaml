apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usages.protection.crossplane.io
spec:
  group: protection.crossplane.io
  names:
    kind: Usage
    listKind: UsageList
    plural: usages
    singular: usage
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - of
                - by
              properties:
                of:
                  type: object
                  required:
                    - apiVersion
                    - kind
                  properties:
                    apiVersion:
                      type: string
                      description: API version of the referenced resource
                    kind:
                      type: string
                      description: Kind of the referenced resource
                    resourceSelector:
                      type: object
                      description: Selector for the referenced resources
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                by:
                  type: object
                  required:
                    - apiVersion
                    - kind
                  properties:
                    apiVersion:
                      type: string
                      description: API version of the resource causing the usage
                    kind:
                      type: string
                      description: Kind of the resource causing the usage
                    resourceSelector:
                      type: object
                      description: Selector for the resources causing the usage
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchControllerRef:
                          type: boolean
                reason:
                  type: string
                  description: Reason for this usage
                replayDeletion:
                  type: boolean
                  description: Whether deletion should be replayed
          required:
            - spec
  preserveUnknownFields: false

